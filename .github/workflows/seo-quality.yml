name: SEO Quality

# Keep SEO CI attached to every production update on main and run
# the same full SEO audit three times every day for freshness.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 06:10, 14:10 and 22:10 Asia/Kolkata every day.
    # Offset from the hour reduces GitHub Actions peak-load delays.
    - cron: '10 6 * * *'
      timezone: 'Asia/Kolkata'
    - cron: '10 14 * * *'
      timezone: 'Asia/Kolkata'
    - cron: '10 22 * * *'
      timezone: 'Asia/Kolkata'

permissions:
  contents: read

concurrency:
  group: seo-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate audit script
        run: node --check scripts/seo-audit.mjs
      - name: Audit every indexable page
        run: node scripts/seo-audit.mjs
