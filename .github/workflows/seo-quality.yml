name: Fresh Updates + SEO Quality

# Collect current Bigg Boss coverage three times daily, publish it to the
# production branch, render the analyzed result, then run the full SEO audit.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 06:10, 14:10 and 22:10 Asia/Kolkata every day.
    # Offset from the hour reduces GitHub Actions peak-load delays.
    - cron: '10 6 * * *'
      timezone: 'Asia/Kolkata'
    - cron: '10 14 * * *'
      timezone: 'Asia/Kolkata'
    - cron: '10 22 * * *'
      timezone: 'Asia/Kolkata'

permissions:
  contents: write

concurrency:
  group: fresh-updates-seo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate scripts
        run: |
          node --check scripts/fresh-updates.mjs
          node --check scripts/editorial-refresh.mjs
          node --check scripts/normalize-homepage-seo.mjs
          node --check scripts/seo-audit.mjs

      - name: Collect and publish fresh updates
        if: github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[fresh-auto]')
        run: node scripts/fresh-updates.mjs

      - name: Normalize homepage SEO metadata
        if: github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[fresh-auto]')
        run: node scripts/normalize-homepage-seo.mjs

      - name: Render analyzed result for readers
        if: github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[fresh-auto]')
        run: node scripts/editorial-refresh.mjs

      - name: Commit published updates
        if: github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[fresh-auto]')
        run: |
          if git diff --quiet; then
            echo 'No new content changes to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html today/index.html sitemap.xml .fresh-update-state.json scripts/editorial-refresh.mjs
          git commit -m "chore: publish analyzed Bigg Boss updates [fresh-auto]"

          # Main can move while this job is generating fresh content. Rebase
          # and retry the push so transient non-fast-forward races do not lose
          # the published update. Stop only after the push is accepted.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Published successfully to main on attempt ${attempt}."
              exit 0
            fi
            echo "Push attempt ${attempt} failed; refreshing main and retrying."
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo 'ERROR: unable to push the published update to main after 5 attempts.'
          exit 1

      - name: Audit every indexable page
        run: node scripts/seo-audit.mjs
