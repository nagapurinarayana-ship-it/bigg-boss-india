name: SEO and ad integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate crawl files and homepage metadata
        shell: bash
        run: |
          set -euo pipefail
          test -s robots.txt
          test -s sitemap.xml
          test -s index.html
          grep -qi '<title>.*</title>' index.html
          grep -qi 'name="description"' index.html
          grep -qi 'rel="canonical"' index.html
          grep -qi 'name="robots"' index.html
          grep -qi 'application/ld+json' index.html
          grep -q 'Sitemap: https://bigg-boss-india.pages.dev/sitemap.xml' robots.txt
          grep -q '<loc>https://bigg-boss-india.pages.dev/' sitemap.xml
      - name: Require homepage ad host and loader
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'class="ad-slot ad-banner" data-bigg-banner' index.html
          grep -q 'aria-label="Advertisement"' index.html
          grep -q 'src="/ads.js?v=20261015-ad-integrity"' index.html
      - name: Preserve required ad integrations
        shell: bash
        run: |
          set -euo pipefail
          test -s ads.js
          grep -q 'document.querySelector('\''[data-bigg-banner]'\'')' ads.js
          grep -q 'highperformanceformat.com' ads.js
          grep -q 'effectivecpmnetwork.com' ads.js
          grep -q 'socialBarSrc' ads.js
          grep -q 'Sponsored recommendations' ads.js
          grep -q 'More sponsored offers' ads.js
          test -s style.css
          grep -q '\.ad-slot' style.css
          grep -q '\.ad-banner' style.css
